# Green, as defined by R-6. Runs on every push and pull request.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Checker tests
        working-directory: factory/checks
        run: bun test
      - name: Doctrines, lookup tables, secrets
        run: bun factory/checks/check-repo.mjs .

  m365-spike:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m365/spike
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('m365/spike/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
        env:
          AUTH_SECRET: build-only-placeholder
